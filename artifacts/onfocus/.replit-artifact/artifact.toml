kind = "web"
previewPath = "/"
title = "OnFocus"
version = "1.0.0"
id = "artifacts/onfocus"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21917

[services.development]
run = "pnpm --filter @workspace/onfocus run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/onfocus", "run", "build" ]
publicDir = "artifacts/onfocus/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21917"
BASE_PATH = "/"
